name: Baselines

on:
  push:
    branches: [tmp-baselines-bd59b564]

permissions:
  contents: read

jobs:
  visual:
    name: Baselines (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-light, desktop-dark, mobile-light, mobile-dark]
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Placeholders for new variants
        run: |
          ph=$(ls e2e/visual.spec.ts-snapshots/*.png | head -1)
          node scripts/sync-handbook-images.mjs 2>&1 | grep -o '[^ ]*-linux.png →' | sed 's/ →//' | sort -u | while read f; do cp "$ph" "e2e/visual.spec.ts-snapshots/$f"; done
          git status --short | wc -l
      - name: Visual (update changed)
        run: npx playwright test e2e/visual.spec.ts --project=${{ matrix.project }} --update-snapshots=changed --reporter=line
        env:
          HOSTNAME: 0.0.0.0
      - name: Changed snapshots
        if: always()
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p out
          git status --porcelain e2e/visual.spec.ts-snapshots | awk '{print $2}' | while read f; do cp "$f" out/; done
          ls out | wc -l
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baselines-${{ matrix.project }}
          path: out/
